name: NitpickDemo
options:
  bundleIdPrefix: dev.nitpick.demo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
packages:
  Nitpick:
    path: ..
targets:
  NitpickDemo:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: Nitpick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nitpick.demo.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nitpick Demo
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
  NitpickDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: NitpickDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nitpick.demo.uitests
schemes:
  NitpickDemo:
    build:
      targets:
        NitpickDemo: all
    run:
      config: Debug
      environmentVariables:
        - variable: NITPICK_DEMO_MODE
          value: dryrun
          isEnabled: true
        - variable: NITPICK_DEMO_MODE
          value: send
          isEnabled: false
        - variable: NITPICK_KEY
          value: ""
          isEnabled: false
        - variable: NITPICK_API_URL
          value: http://localhost:3000
          isEnabled: false
    test:
      config: Debug
      targets:
        - NitpickDemoUITests
